<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Plataforma profesional de alabanza para iglesias">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            'primary-dark': '#2563eb',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <title>WorshipHub - Plataforma de Alabanza</title>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col antialiased">
  <div id="app" class="flex-1 flex flex-col">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <i class="fas fa-music text-3xl text-blue-600"></i>
          <div>
            <h1 class="text-xl font-bold text-gray-800">Worship<span class="text-blue-600">Hub</span></h1>
            <p class="text-xs text-gray-500">Plataforma de Alabanza</p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span id="connection-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">
            <i class="fas fa-circle text-xs text-green-500 mr-1"></i> Online
          </span>
          <nav class="hidden md:flex items-center space-x-1">
            <button class="nav-btn active px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700" data-view="songs">
              <i class="fas fa-music mr-1"></i> Canciones
            </button>
            <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100" data-view="setlists">
              <i class="fas fa-list mr-1"></i> Setlists
            </button>
            <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100" data-view="events">
              <i class="fas fa-calendar-alt mr-1"></i> Eventos
            </button>
          </nav>
        </div>
      </div>
    </header>

    <main id="main-content" class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
      <!-- PANTALLA DE CARGA -->
      <div id="loading-screen" class="flex items-center justify-center py-20">
        <div class="text-center">
          <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600 mx-auto"></div>
          <p class="mt-4 text-gray-500 text-lg">Cargando WorshipHub...</p>
          <p class="text-gray-400 text-sm mt-1">Conectando con Airtable</p>
        </div>
      </div>
      
      <!-- CONTENIDO DINÁMICO (inicialmente oculto) -->
      <div id="dynamic-content" class="hidden">
        <!-- Aquí se renderiza todo -->
      </div>
    </main>

    <nav class="md:hidden bg-white border-t border-gray-200 px-2 py-2 flex justify-around items-center text-xs sticky bottom-0 z-50">
      <button class="mobile-nav-btn flex flex-col items-center text-blue-600" data-view="songs">
        <i class="fas fa-music text-xl"></i>
        <span class="font-medium">Canciones</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-gray-500" data-view="setlists">
        <i class="fas fa-list text-xl"></i>
        <span class="font-medium">Setlists</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-gray-500" data-view="events">
        <i class="fas fa-calendar-alt text-xl"></i>
        <span class="font-medium">Eventos</span>
      </button>
    </nav>
  </div>

  <!-- Chatbot flotante -->
  <div id="chatbot-container" class="hidden fixed bottom-6 right-6 z-50 flex flex-col w-96 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
    <div class="bg-blue-600 text-white p-4 flex items-center justify-between cursor-pointer" id="chat-header">
      <div class="flex items-center gap-2">
        <i class="fas fa-robot"></i>
        <span class="font-semibold">Asistente IA</span>
      </div>
      <button id="close-chat" class="text-white hover:text-gray-200"><i class="fas fa-times"></i></button>
    </div>
    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto h-80 space-y-3 bg-gray-50">
      <div class="text-center text-gray-400 text-sm p-4">Pregunta sobre la canción actual</div>
    </div>
    <div class="p-3 border-t border-gray-200 flex gap-2">
      <input type="text" id="chat-input" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Escribe tu pregunta...">
      <button id="chat-send" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
  
  <button id="chat-toggle" class="fixed bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center hover:bg-blue-700 transition-all z-50">
    <i class="fas fa-comment-dots text-xl"></i>
  </button>

  <!-- TEMPORIZADOR DE EMERGENCIA: Si en 3 segundos no se quitó el loading, lo fuerza -->
  <script>
    setTimeout(function() {
      var loading = document.getElementById('loading-screen');
      var dynamic = document.getElementById('dynamic-content');
      if (loading && !loading.classList.contains('hidden')) {
        console.warn('Forzando desaparición del loading por timeout de emergencia');
        loading.classList.add('hidden');
        if (dynamic) {
          dynamic.classList.remove('hidden');
          dynamic.innerHTML = '<div class="text-center py-20"><i class="fas fa-info-circle text-4xl text-blue-500 mb-4"></i><p class="text-gray-600 text-lg">La aplicación está lista</p><p class="text-gray-400 text-sm">Si no ves canciones, verifica tu conexión o crea una nueva.</p><button id="retry-load" class="btn btn-primary mt-4"><i class="fas fa-sync-alt mr-2"></i>Reintentar carga</button></div>';
        }
      }
    }, 3000);
  </script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
