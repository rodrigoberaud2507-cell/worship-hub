<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="/css/style.css">
  <title>WorshipHub</title>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col">
    <!-- Barra superior -->
    <nav class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎵</span>
        <h1 class="text-2xl font-bold text-gray-800">Worship<span class="text-blue-600">Hub</span></h1>
      </div>
      <div class="flex items-center space-x-4">
        <span id="connection-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">🟢 Online</span>
      </div>
    </nav>

    <!-- Contenido principal -->
    <main id="main-content" class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
      <!-- Vista renderizada dinámicamente -->
    </main>

    <!-- Barra inferior móvil -->
    <nav class="md:hidden bg-white border-t border-gray-200 px-4 py-2 flex justify-around items-center">
      <button class="nav-btn text-blue-600" data-view="songs">🎵 Canciones</button>
      <button class="nav-btn text-gray-400" data-view="setlists">📋 Setlists</button>
      <button class="nav-btn text-gray-400" data-view="rehearsal">🎯 Ensayo</button>
      <button class="nav-btn text-gray-400" data-view="settings">⚙️</button>
    </nav>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
